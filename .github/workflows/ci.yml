name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      name: Check out repository
    - name: Set up mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      with:
        cache_key_prefix: mise-v0-stable
    - run: mise run lint

  test:
    name: Test (Go ${{ matrix.mise-env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mise-env: ["stable", "oldstable"]

    env:
      MISE_ENV: ${{ matrix.mise-env }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      with:
        cache_key_prefix: mise-v0-${{ matrix.mise-env }}
    - name: Test
      run: mise run cover
    - name: Upload coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
